#################################################
####  Root Site Admin Spawner Config Object  ####
#################################################

siteSettings:
    kind: tabs
    name: dqrAdminPage
    groups:
        dqrTabGroup: DICOM Query-Retrieve
    contents:
        ${dqrPacsTab}
        ${dqrHistoryTab}
        #${dqrAnon}

####
#### DQR Site Settings Panels
####

dqrPacsTab:
    kind: tab
    name: dqrPacsTab
    label: DQR Settings
    group: dqrTabGroup
    active: false
    contents:
        ${dqrPacsPanel}
        ${dqrDicomIdentifierPanel}
        ${dqrOtherPreferencePanel}

dqrHistoryTab:
    kind: tab
    name: dqrHistoryTab
    label: Query History
    group: dqrTabGroup
    active: false
    contents:
        ${dqrHistoryPanel}

dqrPacsPanel:
    kind: panel
    name: dqrPacsPanel
    label: Manage Connected PACS/VNA
    contents:
        dqrPacsTableContainer:
            tag: "div#pacsDiv"
            content: No PACS/VNA connections yet
        dqrPacsScript:
            tag: script|src="~/scripts/xnat/plugin/dqr/PacsAdministration.js"
        dqrPacsCss:
            tag: link|href="~/style/dqr/dqr.css"|rel="stylesheet"|type="text/css"

dqrDicomIdentifierPanel:
    kind: panel
    name: dqrDicomIdentifierPanel
    label: DICOM Object Identifiers
    contents:
        dqrDicomIdentifierHelptext:
            tag: div.message
            content: >
                The DICOM Query Retrieve Plugin adds a new DICOM Object Identifier to your XNAT configuration. In general, identifiers affect how DICOM metadata is mapped into XNAT-enabled datatypes. Each DICOM SCP Receiver that you have defined in your core XNAT administrative settings will be assigned to use one of these identifiers. <br><br>
                In order to ensure proper project routing on imports, you must have an SCP Receiver defined that uses a DQR-enabled DICOM Object Identifier from this list. Then, your PACS must be configured to send to that SCP Receiver.
            after: >
                <br>
        dqrDicomIdentifierTableContainer:
            tag: div#dqrDicomIdentifierTableContainer

dqrOtherPreferencePanel:
    kind: panel.form
    name: dqrOtherPreferencePanel
    label: Other Preferences
    method: POST
    url: ~/xapi/dqr/settings
    contentType: json
    contents:
        dqrCallingAe:
            kind: panel.input.text
            name: dqrCallingAe
            label: Calling AE Title
            value: 'XNAT'
            placeholder: Calling AE Title
            description: >
                Enter the calling AE Title that should be used for all DICOM queries this site makes. This name is registered with remote PACS and DICOM AEs, along with your server's IP address and SCP Receiver port.
                Changing the AE Title could affect your ability to communicate with your PACS systems.
        pacsAvailabilityCheckFrequency:
            kind: panel.input.text
            name: pacsAvailabilityCheckFrequency
            label: PACS Threads Check Frequency
            value: '1 minute'
            validation: interval onblur
            description: >
                How often to check how many threads are currently configured for each PACS. If there are more threads
                configured than are currently open, additional threads will be opened (if there are more threads open
                than are currently configured, they will be ended once they complete their current PACS request). Uses
                <a target="_blank" href="http://www.postgresql.org/docs/9.0/static/functions-datetime.html">PostgreSQL interval notation</a>.
        dqrMaxPacsRequestAttempts:
            kind: panel.input.text
            size: 10
            name: dqrMaxPacsRequestAttempts
            label: Maximum Retrieve Attempts
            placeholder: 5
            description: Maximum number of attempts to make when retrieving data from a PACS.
            validation: number
        dqrWaitToRetryRequestInSeconds:
            kind: panel.input.text
            size: 10
            name: dqrWaitToRetryRequestInSeconds
            label: Retrieve Retry Wait Period
            placeholder: 300
            description: Number of seconds to wait before retrying a failed attempt to retrieve data from a PACS.
            validation: number
        dicomWebMetadataReadTimeoutSeconds:
            kind: panel.input.text
            size: 10
            name: dicomWebMetadataReadTimeoutSeconds
            label: DICOMweb Metadata Read Timeout (seconds)
            placeholder: 20
            description: Socket read timeout for DICOMweb metadata calls (QIDO-RS searches, instance metadata fetches, and PACS ping checks).
            validation: number
        dicomWebRetrieveReadTimeoutSeconds:
            kind: panel.input.text
            size: 10
            name: dicomWebRetrieveReadTimeoutSeconds
            label: DICOMweb Retrieve Read Timeout (seconds)
            placeholder: 20
            description: Socket read timeout for DICOMweb binary retrieval (WADO-RS). Raise on PACS implementations where the server-side response-assembly delay before the first byte exceeds the default.
            validation: number
        dimseResponseTimeoutSeconds:
            kind: panel.input.text
            size: 10
            name: dimseResponseTimeoutSeconds
            label: DIMSE Response Timeout (seconds)
            placeholder: 60
            description: How long to wait for a response to a DIMSE message sent to a PACS over the query/retrieve port.
            validation: number
        dimseRetrieveTimeoutSeconds:
            kind: panel.input.text
            size: 10
            name: dimseRetrieveTimeoutSeconds
            label: DIMSE Retrieve Timeout (seconds)
            placeholder: 60
            description: How long to wait between the sub-operation responses of a C-MOVE. Raise this when retrieving whole studies, which take considerably longer than a single series.
            validation: number
        dimseAcceptTimeoutSeconds:
            kind: panel.input.text
            size: 10
            name: dimseAcceptTimeoutSeconds
            label: DIMSE Association Accept Timeout (seconds)
            placeholder: 60
            description: How long to wait for a PACS to accept an association request.
            validation: number
        dimseConnectTimeoutSeconds:
            kind: panel.input.text
            size: 10
            name: dimseConnectTimeoutSeconds
            label: DIMSE Connect Timeout (seconds)
            placeholder: 30
            description: How long to wait for the network connection to a PACS to be established.
            validation: number
        allowAllUsersToUseDqr:
            kind: panel.input.switchbox
            name: allowAllUsersToUseDqr
            label: Allow DQR for All Users
            onText: Enabled
            offText: Disabled
            description: >
                Should all users always be able to use DQR to access PACS, or should only users that are assigned the 'Dqr' role be able to do so?
        allowAllProjectsToUseDqr:
            kind: panel.input.switchbox
            name: allowAllProjectsToUseDqr
            label: Allow DQR for All Projects
            onText: Enabled
            offText: Disabled
            description: >
                Should users be able to import data to all projects using DQR, or only to projects that have DQR enabled in their project settings?
        notifyAdminOnImport:
            kind: panel.input.switchbox
            name: notifyAdminOnImport
            label: Notify on Import
            onText: Enabled
            offText: Disabled
            description: >
                Should an email be sent to the requesting user and site admin when data is being imported from a PACS? They will receive one email per study requested.
        assumeSameSessionIfArrivedWithin:
            kind: panel.input.text
            name: assumeSameSessionIfArrivedWithin
            label: Assume Same Session If Arrived Within
            value: '30 minutes'
            validation: interval onblur
            description: >
                If DICOM files with the same Study Instance UID, but different Study ID, arrive within this time period
                of each other, XNAT will assume that they belong in the same session. In cases where different series
                in the same study have different Study IDs, this should be set to a positive number so that these don't
                get split up into multiple sessions. However, if you're more worried about avoiding remapping issues
                when requesting the same session repeatedly in quick succession, this should be set to 0. Uses
                <a target="_blank" href="http://www.postgresql.org/docs/9.0/static/functions-datetime.html">PostgreSQL interval notation</a>.


#### DQR History Tab ####

dqrHistoryPanel:
    kind: panel
    name: dqrHistoryPanel
    label: DICOM AE Import Queue and History
    footer: false
    contents:
        dqrQueueContainer:
            tag: div#dqr-queue-container
        dqrHistoryTableContainer:
            tag: div#dqr-history-container
            content: >
                No history to display yet

# PACS Access
pacsAccessTab:
    kind: tab
    label: PACS Access
    group: dqrTabGroup
    contents:
        ${pacsAccessInfo}
        ${pacsAccessPanel}

pacsAccessInfo:
    tag: div.message|style=margin-bottom:20px
    content: >
        Use the controls below to restrict which PACS systems are displayed when initiating an import.

pacsAccessPanel:
    kind: panel
    label: PACS Access Settings
    contents:
        infoText:
            tag: div
            content: >
                (PACS access controls go here)

dqrAnon:
    kind: tab
    label: Anonymization
    group: dqrTabGroup
    contents:
        ${dqrAnonPanel}

dqrAnonPanel:
    kind: panel.form
    label: PACS Import Anonymization
    method: POST
    url: ~/xapi/dqr/anon
    contentType: json
    contents:
        projectId:
            kind: input.hidden
            name: projectId
        dqrAnonEnabled:
            kind: panel.input.switchbox
            name: dqrAnonEnabled
            label: Enabled
            onText: Anon script enabled
            offText: Anon script disabled
            description: >
                Apply anon script to incoming PACS data?
        dqrAnonApplyAll:
            kind: panel.input.switchbox
            name: dqrAnonApplyAll
            label: Apply script
            onText: Apply to <i>all</i> PACS
            offText: Apply only to <i>specified</i> PACS
            description: >
                Apply anon script to ALL PACS defined on this system.
        dqrAnonPACSItems:
            tag: div#dqr-anon-select-pacs.panel-element.disabled
            contents:
                dqrAnonPACS:
                    kind: panel.select.multi
                    name: dqrAnonPACS
                    label: Select PACS
                    options: "$? */xapi/pacs $:json"
                    optionMap:
                        label: aeTitle
                    element:
                        style:
                            minWidth: 300px
                    description: >
                        Select PACS system(s) for which to anonymize incoming data.
        dqrAnonScript:
            kind: panel.textarea
            name: anonScript
            label: Anon Script
            code: text
            description: >
                Anonymization script to apply to incoming PACS data. (Double-click to open in a code editor dialog.)

# end
