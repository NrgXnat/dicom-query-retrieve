# ============================================== #
# Items for "Actions" box on project report page #
# ============================================== #

importFromPacs:
    access:
        - roles: "Dqr && owners"
        - roles: "Dqr && members"
        - roles: "ALL_DATA_ADMIN || Administrator"
        - users: "boss"
        - users: "!guest && not:ANONYMOUS"
        # or
        - deny: "*"  # deny everyone except those listed below
        - allow: "role=Dqr && group=/.+(_owner|_member)$/"  # allow regex pattern-matching between `/` characters
        - allow: "role=Dqr && group=ALL_DATA_ADMIN"
        - allow: "role=Administrator || role=Admin || group=ALL_DATA_ADMIN"
        - allow: "user=boss || user=bob"
    sequence: 99
    seq: 99        # can also use 'seq' instead of 'sequence'
    label: Import From PACS
    href: "#!import"
    submenu:

        - label: "Import Single {{XNAT.app.displayNames.singular.subject}}"
          href: "{{SITE_ROOT}}/app/template/PacsSessionFinder.vm/project/{{XNAT.context.projectId}}"

        - label: "Import {{XNAT.app.displayNames.singular.subject}} List"
          href: "~/app/template/SpreadsheetBasedImporter.vm/project/{{XNAT.context.projectId}}"

# end
