-->

<header id="content-header">
    <div class="pad" style="padding:20px 0;">
        <h2 class="pull-left" style="margin:0;">Import Studies from PACS</h2>
        <div id="select-pacs-menu-container" class="pull-right">
            <label for="select-pacs"><b>Source PACS:</b></label>
            <select id="select-pacs" style="min-width:200px;">
                <option value="">Select PACS&hellip;</option>
            </select>
            <script>
                menuInit($('#select-pacs'), {}, 200);
            </script>
        </div>
        <div class="clearfix clear"></div>
    </div>
</header>

<div id="pacs-import-search">

    <!-- Panel for search form, CSV import, and search results table -->
    <div class="panel panel-default">
        <div class="panel-heading" style="color:inherit;background:#e0e0e0;line-height:26px;">
            <h3 class="panel-title pull-left" style="font-size:16px;">Enter Search Criteria &nbsp;<small>&hellip;or&hellip;</small>&nbsp; <a id="import-csv" class="link" href="#!">Import CSV</a></h3>
            <div class="pull-right">
                <button type="button" class="btn btn-sm" id="clear-search-results">Clear Search</button>
            </div>
            <div class="clearfix clear"></div>
        </div>
        <div class="panel-body" style="background:#f0f0f0;">

            <style>
                .pacs-search-item {
                    display: block;
                    min-width: 180px;
                    float: left;
                }
                .pacs-search-item b {
                    display: block;
                    font-weight: normal;
                    margin: 8px 2px;
                }
                #pacs-search-results input.relabel {
                    width: 90%;
                }
                /*#pacs-search-results td.accessionNumber:hover,*/
                /*#pacs-search-results td.patientName:hover,*/
                /*#pacs-search-results td.studyId:hover,*/
                /*#pacs-search-results td.studyDate:hover,*/
                /*#pacs-search-results td.modalitiesInStudy:hover {*/
                    /*cursor: pointer*/
                /*}*/
                #pacs-search-results div.results-body tr:hover {
                    cursor: pointer
                }
            </style>

            <form id="pacs-search-fields" class="pull-left">
                <label class="pacs-search-item pull-left">
                    <input type="text" name="accessionNumber" placeholder="All" tabindex="1">
                    <b>Accession Number</b>
                </label>
                <label class="pacs-search-item pull-left">
                    <input type="text" name="patientName" placeholder="Last, First" tabindex="1">
                    <b>Patient Name</b>
                </label>
                <label class="pacs-search-item pull-left">
                    <input type="text" name="patientId" placeholder="All" tabindex="1">
                    <b>Patient ID</b>
                </label>
                <div class="pacs-search-item pull-left">
                    <input type="text" class="study-date mono" id="study-date-from" name="studyDateFrom" size="10" autocomplete="off" tabindex="1" placeholder="YYYY-MM-DD">
                    -
                    <input type="text" class="study-date mono" id="study-date-to" name="studyDateTo" size="10" autocomplete="off" tabindex="1" placeholder="YYYY-MM-DD">
                    <button class="ignore btn btn-sm" type="button" id="study-date-today" name="!studyDateToday">Today</button>
                    <b>Date Range</b>
                </div>
            </form>
            <div id="pacs-search-submit" class="pull-right">
                <button type="button" class="btn btn1" id="submit-pacs-search">Search PACS</button>
            </div>

            <div class="clearfix clear"></div>

            <hr>

            <template id="no-search-results" style="display:none;">
                <div class="message">
                    Query the PACS using the form above or by importing a CSV file containing your search criteria. The search results will be displayed here.
                </div>
            </template>

            <div id="pacs-search-results" class="table-group-container">
                <div id="pacs-no-results"></div>
                <div class="results-header"></div>
                <div class="results-body"></div>
                <div class="results-submit"></div>
            </div>

            <!-- immediately insert the default 'no results' message -->
            <script>$('#pacs-no-results').html($('#no-search-results').html())</script>

        </div>
    </div>

    <link  href="${SITE_ROOT}/scripts/lib/air-datepicker/dist/css/datepicker.min.css" rel="stylesheet">
    <script src="${SITE_ROOT}/scripts/lib/air-datepicker/dist/js/datepicker.min.js"></script>
    <script src="${SITE_ROOT}/scripts/lib/air-datepicker/dist/js/i18n/datepicker.en.js"></script>

</div>
