<header id="content-header">
    <div class="pad" style="padding:20px 0;">
        <h2 class="pull-left" style="margin:0;">Import Sessions from PACS</h2>
        <div id="select-pacs-menu-container" class="pull-right">
            <label for="select-pacs"><b>Source PACS:</b></label>
            <select id="select-pacs" style="min-width:200px;">
                <option value="">Select PACS&hellip;</option>
            </select>
            <script>
                // menuInit($('#select-pacs').changeVal(window.selectedPACS || ''));
                menuInit($('#select-pacs'));
            </script>
        </div>
        <div class="clearfix clear"></div>
    </div>
</header>

<div id="pacs-import-search">

    <!-- Panel for search form, CSV import, and search results table -->
    <div class="panel panel-default">
        <div class="panel-heading" style="color:inherit;background:#e0e0e0;line-height:26px;">
            <h3 class="panel-title pull-left" style="font-size:16px;">Enter Search Criteria &nbsp;<small>&hellip;or&hellip;</small>&nbsp; <a id="import-csv" class="link" href="#!">Import CSV</a></h3>
            <div class="pull-right">
                <button type="button" class="btn btn-sm" id="clear-search-results">Clear Search Results</button>
            </div>
            <div class="clearfix clear"></div>
        </div>
        <div class="panel-body" style="background:#f0f0f0;">

            <style>
                .pacs-search-item {
                    display: block;
                    min-width: 180px;
                    float: left;
                }
                .pacs-search-item b {
                    display: block;
                    font-weight: normal;
                    margin: 8px 2px;
                }
            </style>

            <form id="pacs-search-fields" class="pull-left">
                <label class="pacs-search-item pull-left">
                    <input type="text" name="accessionNumber" placeholder="All">
                    <b>Accession Number</b>
                </label>
                <label class="pacs-search-item pull-left">
                    <input type="text" name="patientId" placeholder="All">
                    <b>Patient ID</b>
                </label>
                <label class="pacs-search-item pull-left">
                    <input type="text" name="patientName" placeholder="All">
                    <b>Patient Name <i style="font-weight:normal;font-style:normal;">(Last^First)</i></b>
                </label>
                <label class="pacs-search-item pull-left">
                    <input type="text" class="study-date mono" id="study-date-from" name="studyDateFrom" size="10" placeholder="from date">
                    -
                    <input type="text" class="study-date mono" id="study-date-to" name="studyDateTo" size="10" placeholder="to date">
                    <label>&nbsp;&nbsp;&nbsp;<input class="ignore" type="checkbox" id="study-date-today" name="studyDateToday">&nbsp;Today</label>
                    <b>Date</b>
                </label>
            </form>
            <div id="pacs-search-submit" class="pull-right">
                <button type="button" class="btn btn1" id="submit-pacs-search">Search PACS</button>
            </div>

            <div class="clearfix clear"></div>

            <hr>

            <template id="no-search-results" style="display:none;">
                <div class="message">
                    Query the PACS using the form above or by importing a CSV file containing your search criteria. The search results will be displayed here.
                </div>
            </template>

            <div id="pacs-search-results"></div>

            <!-- immediately insert the default 'no results' message -->
            <script>$('#pacs-search-results').html($('#no-search-results').html())</script>

        </div>
    </div>

</div>

<!-- #* <%-- the #[[ syntax prevents Velocity from parsing the enclosed code --%> *# -->
<!-- #[[ -->
<script>
    // simpler selectable table behavior
    // init on a <table> or *any* container element
    XNAT.app.selectableItems = function(container){

        var $container = $$(container || document);

        var CKBX_ALL = '.selectable-select-all';
        var CKBX_ONE = '.selectable-select-one';
        var INDET    = 'indeterminate';

        // namespaced event name
        var CLICK    = 'click.multicheck';

        var $ckbxAll = $container.find(CKBX_ALL);
        var $ckbxs   = $container.find(CKBX_ONE);

        function toggleAll(checked){
            $ckbxAll.prop(INDET, false);
            $ckbxs.prop('checked', checked);
        }

        function multichecker(){
            // if all checkboxes are checked now, check the 'all' checkbox
            var checkedCount = $ckbxs.filter(':checked').length;
            if (checkedCount === 0 || checkedCount === $ckbxs.length) {
                $ckbxAll.prop(INDET, false).prop('checked', !!checkedCount);
            }
            else {
                $ckbxAll.prop('checked', false).prop(INDET, true);
            }
        }
        // fire this on init to set the initial
        // state of the 'all' checkbox
        multichecker();

        // unbind any existing 'multicheck' click handlers
        $container.off(CLICK);

        $container.on(CLICK, CKBX_ALL, function(e){
            toggleAll(!!this.checked);
        });

        $container.on(CLICK, CKBX_ONE, function(e){
            multichecker();
        });

    }
</script>
