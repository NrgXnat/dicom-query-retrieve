def pluginVersion = '1.0.0-PRERELEASE'
def vXnat = '1.7.5'

apply plugin: 'io.spring.dependency-management'
apply plugin: 'groovy'
apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'maven'
apply plugin: 'maven-publish'
apply plugin: 'idea'
apply plugin: "io.franzbecker.gradle-lombok"
apply plugin: 'eclipse'

buildscript {
    repositories {
        mavenLocal()
        jcenter()
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url 'https://nrgxnat.jfrog.io/nrgxnat/libs-release'
            name 'XNAT Release Repository'
        }
        maven {
            url 'https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot'
            name 'XNAT Snapshot Repository'
        }
    }
    dependencies {
        classpath "org.hibernate:hibernate-validator:6.0.3.Final"
        classpath "io.franzbecker:gradle-lombok:1.11"
        classpath "io.spring.gradle:dependency-management-plugin:1.0.3.RELEASE"
        classpath "org.apache.maven.plugins:maven-resources-plugin:2.5"
        classpath "org.apache.maven.plugins:maven-compiler-plugin:3.7.0"
        classpath "org.apache.maven.plugins:maven-surefire-plugin:2.20.1"
        classpath "org.apache.maven.plugins:maven-antrun-plugin:1.8"
        classpath "org.apache.maven.plugins:maven-jar-plugin:3.0.2"
        classpath "javax.validation:validation-api:2.0.0.Final"
        classpath "org.nrg.xdat:core:1.7.5"
        classpath "org.nrg:framework:1.7.5"
        classpath ("org.nrg.xnat.build:xnat-data-builder:1.7.5"){
            exclude group:'torque'
        }
    }
}

group 'org.nrg.xnat'
version pluginVersion


repositories {
    mavenLocal()
    maven {
        url "http://maven.imagej.net/content/groups/public"
        name "ImageJ Maven Repository"
    }
    jcenter()
    mavenCentral()
    maven {
        url 'https://nrgxnat.jfrog.io/nrgxnat/libs-release'
        name 'XNAT Release Repository'
    }
    maven {
        url 'https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot'
        name 'XNAT Snapshot Repository'
    }
    maven {
        url 'https://nrgxnat.jfrog.io/nrgxnat/ext-release'
        name 'XNAT External Release Repository'
    }
}

sourceCompatibility = 1.7
targetCompatibility = 1.7

if (hasProperty("rt.17.jar")) {
    // Solution for bootstrap classpath warning and possible issues with compatibility with 1.7 libraries
    // was taken from this post on discuss.gradle.org: http://bit.ly/24xD9j0
    String rt17jar = getProperty("rt.17.jar")
    logger.info "Using ${rt17jar} as the bootstrap class path jar."
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.fork = true
            options.compilerArgs << "-XDignore.symbol.file"
            options.bootClasspath = rt17jar
        }
    }
} else {
    logger.warn "No value was set for the rt.17.jar build property, using the default bootstrap class path. You should consider setting rt.17.jar to indicate a jar file containing the Java 1.7 run-time library:\n"
    logger.warn "  ./gradlew -Prt.17.jar=rt-1.7.0_45.jar war\n"
}

compileJava {
    options.fork = false
}

jacoco {
    toolVersion = "0.7.9"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.enabled = false
        csv.enabled = false
        html.destination file("${buildDir}/jacocoHtml")
    }
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir 'build/xnat-generated/src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
            srcDir 'build/xnat-generated/src/main/resources'
        }
    }
}

configurations {
    all {
        exclude group: 'edu.ucar', module: 'netcdf'
        exclude group: 'jakarta-regexp'
        exclude group: 'net.sf.saxon', module: 'Saxon-B'
        exclude group: 'org.apache.geronimo.specs'
        exclude module: 'pipelineCNDAXNAT'
        exclude group: 'jamon'
    }
    compile.extendsFrom(compileAndInclude)
}

dependencyManagement.imports {
    mavenBom "org.nrg:parent:${vXnat}"
}

dependencies {
    implementation "org.nrg.xnat:web"
    implementation 'javax.servlet:servlet-api'
    implementation 'velocity:velocity'
    implementation 'org.hibernate:hibernate-core'
    implementation 'com.google.guava:guava'
    implementation 'commons-lang:commons-lang'
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'org.hibernate.javax.persistence:hibernate-jpa-2.1-api'
    implementation 'javax.jms:javax.jms-api'
    implementation 'javax.inject:javax.inject'
    implementation 'org.restlet:org.restlet'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'org.nrg:mail'
    implementation "org.nrg:dicomtools"
    implementation "org.nrg:dicom-xnat-mx"
    implementation "org.nrg.dicom:dicom-edit4"
    implementation "org.nrg.xnat:xnat-data-models"
    implementation "org.nrg.xdat:core"
    implementation "org.nrg:framework"
    implementation "org.nrg:config"
    implementation "javax.servlet:javax.servlet-api"
    implementation "turbine:turbine"
    implementation "org.apache.velocity:velocity"
    implementation "org.springframework:spring-beans"
    implementation "org.springframework:spring-context"
    implementation "org.springframework:spring-jms"
    implementation "org.springframework:spring-tx"
    implementation 'org.springframework:spring-webmvc'
    implementation "io.springfox:springfox-swagger2"
    implementation "javax.validation:validation-api:2.0.1.Final"

    compileAndInclude('dcm4che.tool:dcm4che-tool-dcmecho') {
        transitive = false
    }
    compileAndInclude('dcm4che.tool:dcm4che-tool-dcmqr') {
        transitive = false
    }
    compileAndInclude('commons-cli:commons-cli:1.4') {
        transitive = false
    }

    testImplementation 'junit:junit'
    testImplementation "org.springframework:spring-test"
    testImplementation "log4j:log4j"
}

task fatJar(type: Jar) {
    zip64 true
    classifier = "fat"
    from {
        configurations.compileAndInclude.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
    with jar
}
