buildscript {
    ext {
        vXnat = "1.11.0-SNAPSHOT"
    }
}

plugins {
    id "eclipse"
    id "idea"
    id "jacoco"
    id "java"
    id "maven-publish"
    id "com.dorongold.task-tree" version "1.5"
    id "com.palantir.git-version" version "3.1.0"
    id "io.franzbecker.gradle-lombok" version "5.0.0"
    id "io.spring.dependency-management" version "1.1.7"
    id "org.nrg.xnat.build.xnat-data-builder" version "${vXnat}"
    id("org.openrewrite.rewrite") version("6.24.0")    
}

group "org.nrg.xnatx.plugins"
version "3.1.0-SNAPSHOT"
description "XNAT DICOM Query/Retrieve Plugin"

repositories {
    // Scope mavenLocal to org.nrg.* so a partial ~/.m2 can't shadow third-party
    // artifacts that ship classifier jars (e.g. ehcache -jakarta) — those must
    // resolve from jfrog/Central. (plugin-migration-guide J1)
    mavenLocal { content { includeGroupByRegex "org\\.nrg.*" } }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-release" }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot" }
    mavenCentral()
    maven { url "https://jitpack.io" }
    maven { url "https://www.dcm4che.org/maven2" }
    maven { url "https://raw.githubusercontent.com/nroduit/mvn-repo/master/" }  // weasis dependencies for dcm4che 5.x
}

java {
    // Pin a JDK 21 toolchain: Lombok 1.18.34 dies on a too-new JDK
    // (NoSuchFieldException TypeTag.UNKNOWN) and JDK 22+ refuses to read old jars
    // the BOM still pins (aspectjweaver). fork=true runs javac in that toolchain JVM.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

compileJava {
    options.fork = true
    // -parameters: Spring 6 xapi @RestController arg binding needs real parameter names
    options.compilerArgs << "-parameters"
}

sourceSets {
    main {
        java {
            srcDir "build/xnat-generated/src/main/java"
        }
        resources {
            srcDir "build/xnat-generated/src/main/resources"
        }
    }
}

configurations {
    all {
        exclude group: "junit"
        exclude group: "log4j"
        exclude group: "net.logstash.logback"
        exclude group: "org.nrg.xnat.pipeline"
        exclude group: "org.slf4j", module: "jcl-over-slf4j"
        exclude group: "org.slf4j", module: "log4j-over-slf4j"
        exclude group: "org.slf4j", module: "slf4j-log4j12"
        exclude group: "org.slf4j", module: "slf4j-simple"
    }
    implementation.extendsFrom(implementAndInclude)
}

test {
    useJUnitPlatform {
        includeEngines "junit-jupiter"
        excludeEngines "junit-vintage"
    }

    minHeapSize = "512m"
    maxHeapSize = "4g"
}

dependencyManagement {
    imports {
        mavenBom "org.nrg:parent:${vXnat}"
    }
    generatedPomCustomization {
        enabled = false
    }
}

def vDcm4che = "5.33.1"
def vCommonsCli = "1.4"

dependencies {
    rewrite("org.openrewrite.recipe:rewrite-migrate-java:2.26.0")

    implementation enforcedPlatform("org.nrg:parent:${vXnat}")

    implementation "org.nrg.xnat:web"
    implementation "org.nrg.dicom:dicom-edit4"
    implementation "org.nrg.dicom:dicom-edit6"
    implementation "org.nrg:dicom-xnat-util"
    implementation "org.springframework:spring-web"
    implementation "org.springframework:spring-tx"
    implementation "org.springframework:spring-jms"
    implementation "org.springframework:spring-jdbc"
    implementation "org.springframework:spring-context"
    // springfox is dead on Spring 6; core's springdoc generates docs from the MVC
    // mappings. Keep swagger-annotations so the legacy @Api/@ApiOperation still compile.
    compileOnly "io.swagger:swagger-annotations:1.5.20"
    // dcm4che5 dependencies (replacing dcm4che2)
    implementation "org.dcm4che:dcm4che-core"
    implementation "org.dcm4che:dcm4che-net"
    // Jakarta stack renames these: the javax coordinates aren't managed by the 1.11.0
    // BOM. hibernate-core-jakarta / hibernate-envers-jakarta are the differently-named
    // jakarta.persistence artifacts core uses (monorepo gradle/libs.versions.toml).
    implementation "org.hibernate:hibernate-core-jakarta"
    implementation "org.hibernate:hibernate-envers-jakarta"
    implementation "com.fasterxml.jackson.core:jackson-core"
    implementation "com.fasterxml.jackson.core:jackson-annotations"
    implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation "org.apache.commons:commons-lang3"
    implementation "org.aspectj:aspectjweaver"
    implementation "jakarta.validation:jakarta.validation-api:3.0.2"
    implementation "org.restlet:org.restlet"

    implementation("org.apache.turbine:turbine") {
        transitive = false
    }

    // Removed dcm4che2 tools - replaced with dcm4che5 API
    implementAndInclude("commons-cli:commons-cli:${vCommonsCli}") {
        transitive = false
    }
    implementAndInclude("org.dcm4che:dcm4che-net") {
        transitive = false
    }
    implementAndInclude("org.dcm4che:dcm4che-json") {
        transitive = false
    }
    implementAndInclude("org.dcm4che:dcm4che-mime") {
        transitive = false
    }
    implementAndInclude("jakarta.json:jakarta.json-api:2.1.3")
    implementAndInclude("org.eclipse.parsson:parsson:1.1.6")

    compileOnly "jakarta.interceptor:jakarta.interceptor-api:2.1.0"
    // Compile-only deps that xnat-web no longer surfaces on consumer compileClasspath in monorepo 1.10.1+
    compileOnly "jakarta.servlet:jakarta.servlet-api"
    // Mockito ByteBuddy retransform of xdat Users.class (mocked via mockStatic) needs HttpServletRequest at test runtime
    testRuntimeOnly "jakarta.servlet:jakarta.servlet-api"
    compileOnly("org.apache.velocity:velocity-engine-core") { transitive = false }
    // Screens/actions call data.getParameters() -> org.apache.fulcrum.parser.ParameterParser
    // (Recyclable supertype in fulcrum-pool). Turbine is pulled transitive=false, and these are
    // provided by the XNAT runtime, so compileOnly. (plugin-migration-guide J1)
    compileOnly "org.apache.fulcrum:fulcrum-parser:4.0.0"
    compileOnly "org.apache.fulcrum:fulcrum-pool:1.0.5"
    compileOnly "commons-fileupload:commons-fileupload:1.5"
    compileOnly "jakarta.jms:jakarta.jms-api:3.1.0"
    compileOnly "fop:fop:0.20.5"
    compileOnly "commons-lang:commons-lang:2.6"

    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testImplementation "org.springframework:spring-test"
    testImplementation "com.github.sbrannen:spring-test-junit5"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.mockito:mockito-junit-jupiter"
    testImplementation "org.assertj:assertj-core"
    testImplementation "com.h2database:h2"
    testImplementation "org.dcm4che:dcm4che-json"
    testCompileOnly "commons-lang:commons-lang:2.6"


    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.5"
    testRuntimeOnly "ch.qos.logback:logback-classic"
}

// Pulls in the Jenkins BUILD_NUMBER environment variable if available.
def buildDate = new Date()
def buildNumber = System.getenv().BUILD_NUMBER?.toInteger() ?: "Manual"
def isDirty, branchName, gitHash, gitHashFull, commitDistance, lastTag, isCleanTag

try {
    def gitDetails = versionDetails()
    isDirty = gitVersion().endsWith ".dirty"
    branchName = gitDetails.branchName ?: "Unknown"
    gitHash = gitDetails.gitHash
    gitHashFull = gitDetails.gitHashFull
    commitDistance = gitDetails.commitDistance
    lastTag = gitDetails.lastTag
    isCleanTag = gitDetails.isCleanTag
} catch (IllegalArgumentException e) {
    logger.info "Got an error trying to read VCS metadata from git. It's possible this project is not under VCS control. Using placeholder values for manifest entries."
    isDirty = true
    branchName = "Unknown"
    gitHash = "None"
    gitHashFull = "None"
    commitDistance = 0
    lastTag = "None"
    isCleanTag = false
}

ext.gitManifestAttrs = [
        "Application-Name"        : project.description,
        "Build-Date"              : buildDate,
        "Build-Number"            : buildNumber,
        "Implementation-Version"  : project.version,
        "Implementation-Sha"      : gitHash,
        "Implementation-Sha-Full" : gitHashFull,
        "Implementation-Commit"   : commitDistance,
        "Implementation-LastTag"  : lastTag,
        "Implementation-Branch"   : branchName,
        "Implementation-CleanTag" : isCleanTag,
        "Implementation-Dirty"    : isDirty
]

logger.info """
Building artifacts with manifest attributes:

 * Build-Date:              ${buildDate}
 * Build-Number:            ${buildNumber}
 * Implementation-Version:  ${version}
 * Implementation-Sha-Full: ${gitHashFull}
 * Implementation-Sha:      ${gitHash}
 * Implementation-Commit:   ${commitDistance}
 * Implementation-LastTag:  ${lastTag}
 * Implementation-Branch:   ${branchName}
 * Implementation-CleanTag: ${isCleanTag}
 * Implementation-Dirty:    ${isDirty}
"""

rewrite {
    activeRecipe("org.openrewrite.java.migrate.UpgradeToJava21")
    exportDatatables = true
}

lombok {
    version = "1.18.34"
    sha256 = "1ea5ad6c6afcff902d75072b2aaa6695585aebee9f12127e15c0036ba95d2918"
}

task sourceJar(type: Jar, dependsOn: classes) {
    archiveClassifier.set("sources")
    manifest {
        attributes gitManifestAttrs
    }
    from sourceSets.main.allSource
}

task javadocJar(type: Jar) {
    archiveClassifier.set("javadoc")
    manifest {
        attributes gitManifestAttrs
    }
    from javadoc.destinationDir
}

jar {
    dependsOn test, sourceJar, javadocJar
    manifest {
        attributes gitManifestAttrs
    }
}

task xnatPluginJar(type: Jar) {
    dependsOn test, sourceJar, javadocJar
    zip64 true
    archiveClassifier.set "xpl"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes gitManifestAttrs
    }
    // files and folders with "-dev" or "--xx" in their name
    // will not be in the compiled jar
    exclude "**/resources/**/*-dev**"
    exclude "**/resources/**/*--xx**"
    from {
        configurations.implementAndInclude.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
    with jar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifacts {
                artifact sourceJar
                artifact javadocJar
                artifact xnatPluginJar
            }

            pom.withXml {
                def root = asNode()
                root.appendNode("name", project.description)
                root.appendNode("url", "https://bitbucket.org/xnatdev/dicom-query-retrieve")
                root.appendNode("inceptionYear", "2019")

                root.appendNode("scm").with {
                    appendNode("url", "https://bitbucket.org/xnatdev/dicom-query-retrieve")
                    appendNode("connection", "scm:https://bitbucket.org/xnatdev/dicom-query-retrieve")
                    appendNode("developerConnection", "scm:git@bitbucket.org:xnatdev/dicom-query-retrieve.git")
                }

                root.appendNode("licenses").appendNode("license").with {
                    appendNode("name", "Simplified BSD 2-Clause License")
                    appendNode("url", "https://xnat.org/about/license.php")
                    appendNode("distribution", "repo")
                }

                root.appendNode("developers").with {
                    appendNode("developer").with {
                        appendNode("id", "mfmckay")
                        appendNode("name", "Mike McKay")
                        appendNode("email", "mfmckay@wustl.edu")
                    }
                    appendNode("developer").with {
                        appendNode("id", "rherrick")
                        appendNode("name", "Rick Herrick")
                        appendNode("email", "jrherrick@wustl.edu")
                    }
                    appendNode("developer").with {
                        appendNode("id", "hortonw")
                        appendNode("name", "Will Horton")
                        appendNode("email", "hortonw@wustl.edu")
                    }
                    appendNode("developer").with {
                        appendNode("id", "moore.c")
                        appendNode("name", "Charlie Moore")
                        appendNode("email", "moore.c@wustl.edu")
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = "XNAT_Artifactory"
            url = project.version.toString().endsWith("-SNAPSHOT")
                ? "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot-local"
                : "https://nrgxnat.jfrog.io/nrgxnat/libs-release-local"
            // CI injects ORG_GRADLE_PROJECT_artifactoryUser/Token env vars (Gradle maps
            // these to project properties). Local devs can set artifactoryUser/Token in
            // ~/.gradle/gradle.properties. Mirrors monorepo's buildSrc convention.
            credentials {
                username = (project.findProperty("artifactoryUser")  ?: System.getenv("ARTIFACTORY_USER"))  ?: ""
                password = (project.findProperty("artifactoryToken") ?: System.getenv("ARTIFACTORY_TOKEN")) ?: ""
            }
        }
    }
}

