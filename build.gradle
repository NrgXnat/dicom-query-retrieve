buildscript {
    ext {
        vXnat = "1.7.5-SNAPSHOT"
        xnatDEMO = "X.X.X-DEMO-SNAPSHOT"
    }
    repositories {
        mavenLocal()
        jcenter()
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url 'https://nrgxnat.jfrog.io/nrgxnat/libs-release'
            name 'XNAT Release Repository'
        }
        maven {
            url 'https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot'
            name 'XNAT Snapshot Repository'
        }
    }
    dependencies {
        classpath "io.franzbecker:gradle-lombok:1.14"
        classpath "io.spring.gradle:dependency-management-plugin:1.0.6.RELEASE"
        classpath "org.nrg.xnat.build:xnat-data-builder:1.7.5-SNAPSHOT"
    }
}

apply plugin: 'io.spring.dependency-management'
apply plugin: 'groovy'
apply plugin: 'java'
apply plugin: 'jacoco'
apply plugin: 'maven'
apply plugin: 'maven-publish'
apply plugin: 'idea'
apply plugin: "io.franzbecker.gradle-lombok"
apply plugin: 'eclipse'
apply plugin: 'xnat-data-builder'


group 'org.nrg.xnat'
version xnatDEMO

repositories {
    mavenLocal()
    maven {
        url "https://www.dcm4che.org/maven2/"
        name "dcm4che Maven Repository"
    }
    maven {
        url "http://maven.imagej.net/content/groups/public"
        name "ImageJ Maven Repository"
    }
    jcenter()
    mavenCentral()
    maven {
        url 'https://nrgxnat.jfrog.io/nrgxnat/libs-release'
        name 'XNAT Release Repository'
    }
    maven {
        url 'https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot'
        name 'XNAT Snapshot Repository'
    }
    maven {
        url 'https://nrgxnat.jfrog.io/nrgxnat/ext-release'
        name 'XNAT External Release Repository'
    }
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

compileJava {
    options.fork = false
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir 'build/xnat-generated/src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
            srcDir 'build/xnat-generated/src/main/resources'
        }
    }
}

configurations {
    compile.extendsFrom(compileAndInclude)
    all {
        exclude group: "org.jboss.logging"
        exclude group: "edu.ucar", module: "netcdf"
        exclude group: "jakarta-regexp"
        exclude group: "net.sf.saxon", module: "Saxon-B"
        exclude group: "org.apache.geronimo.specs"
        exclude module: "pipelineCNDAXNAT"
        exclude group: "jamon"
    }
}

dependencyManagement.imports {
    mavenBom "org.nrg:parent:${xnatDEMO}"
}

jacoco {
    toolVersion = dependencyManagement.importedProperties["jacoco.version"] as String
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.enabled = false
        csv.enabled = false
        html.destination file("${buildDir}/jacocoHtml")
    }
}

lombok {
    version = dependencyManagement.importedProperties["lombok.version"] as String
    sha256 = dependencyManagement.importedProperties["lombok.checksum"] as String
}

dependencies {
    implementation "org.nrg.xnat:web"
    implementation "javax.validation:validation-api"

    compileAndInclude("dcm4che.tool:dcm4che-tool-dcmecho") {
        transitive = false
    }
    compileAndInclude("dcm4che.tool:dcm4che-tool-dcmqr") {
        transitive = false
    }
    compileAndInclude("commons-cli:commons-cli:1.4") {
        transitive = false
    }

    testCompile "junit:junit"
    testCompile "org.springframework:spring-test"
}

task fatJar(type: Jar) {
    zip64 true
    classifier = "fat"
    from {
        configurations.compileAndInclude.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
    with jar
}
